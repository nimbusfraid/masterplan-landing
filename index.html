<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Любовь Очирова — проектировщик</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
    }
    body {
      overflow-x: hidden;
      max-width: 100vw;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    #root { overflow-x: hidden; }
    details > summary { user-select: none; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="bg-white">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ── Webhooks ──────────────────────────────────────────────────────── */
    // Для форм заявок и заказов шаблонов
    const WEBHOOK_FORMS = 'https://masterplan03.ru/webhook/5046a2e3-91ae-4e3d-b4f6-73950ef6d5df/webhook';
    // TODO: замените на webhook-триггер из workflow ассистента (workflow uP7zV0n3jC1MEBJC)
    // Откройте workflow в N8N → добавьте Webhook-триггер → скопируйте URL сюда
    const WEBHOOK_CHAT = 'https://masterplan03.ru/webhook-test/1fb2bd95-65b8-4b10-8dd3-36f1e1630342';

    /* ── Данные шаблонов ───────────────────────────────────────────────── */
    // Добавляйте/редактируйте шаблоны здесь
    const TEMPLATES = [
      { id: 1, title: 'Студия', area: 28, style: 'Минимализм', price: 12000 },
      { id: 2, title: '1-комнатная квартира', area: 42, style: 'Скандинавский', price: 18000 },
      { id: 3, title: '2-комнатная квартира', area: 58, style: 'Современный', price: 22000 },
      { id: 4, title: '3-комнатная квартира', area: 82, style: 'Неоклассика', price: 28000 },
      { id: 5, title: 'Частный дом (1 этаж)', area: 95, style: 'Современный', price: 35000 },
      { id: 6, title: 'Кухня-гостиная', area: 24, style: 'Лофт', price: 9500 },
    ];

    /* ── Утилиты ───────────────────────────────────────────────────────── */
    function pretty(n) {
      return Number.isFinite(n) ? new Intl.NumberFormat('ru-RU').format(n) : '—';
    }

    async function postWebhook(url, data) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      try { return await res.json(); } catch { return {}; }
    }

    /* ── Layout ────────────────────────────────────────────────────────── */
    function Container({ children, className = '' }) {
      return (
        <div className={`mx-auto w-full max-w-6xl px-4 sm:px-6 lg:px-8 ${className}`}>
          {children}
        </div>
      );
    }

    function SectionTitle({ children, sub }) {
      return (
        <div className="mb-8">
          <h2 className="text-2xl sm:text-3xl font-semibold tracking-tight text-zinc-900">{children}</h2>
          {sub && <p className="mt-2 text-base text-zinc-600 max-w-2xl leading-relaxed">{sub}</p>}
        </div>
      );
    }

    /* ── Blueprint backdrop (без overflow) ────────────────────────────── */
    function BlueprintGrid({ opacity = 0.07 }) {
      return (
        <div className="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true" style={{ opacity }}>
          <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none">
            <defs>
              <pattern id="bp" width="6" height="6" patternUnits="userSpaceOnUse">
                <path d="M6 0H0V6" fill="none" stroke="#94a3b8" strokeWidth="0.5" />
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#bp)" />
            <g stroke="#a1a1aa" strokeWidth="0.3" fill="none">
              <rect x="10" y="20" width="22" height="14" />
              <rect x="40" y="40" width="18" height="10" />
              <line x1="62" y1="20" x2="90" y2="20" />
              <line x1="62" y1="24" x2="90" y2="24" />
            </g>
          </svg>
        </div>
      );
    }

    /* ── Фото-плейсхолдер ─────────────────────────────────────────────── */
    // Чтобы добавить реальное фото — замените этот компонент на:
    // <img src="путь/к/фото.jpg" className="..." alt="..." />
    // или добавьте style={{ backgroundImage: 'url(фото.jpg)', backgroundSize: 'cover' }}
    function PhotoPh({ className = '', label = 'Фото' }) {
      return (
        <div
          className={`flex flex-col items-center justify-center gap-2 text-zinc-400 bg-gradient-to-br from-zinc-50 to-slate-100 border-2 border-dashed border-zinc-200 ${className}`}
        >
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <circle cx="8.5" cy="8.5" r="1.5" />
            <path d="m21 15-5-5L5 21" />
          </svg>
          <span className="text-sm font-medium">{label}</span>
        </div>
      );
    }

    /* ── Карточки ─────────────────────────────────────────────────────── */
    function InfoCard({ title, sub, right, children }) {
      return (
        <div className="rounded-3xl border bg-white p-6 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-md">
          <div className="flex items-baseline justify-between gap-4 mb-4">
            <div>
              <h3 className="text-lg font-semibold text-zinc-900">{title}</h3>
              {sub && <div className="text-sm text-zinc-500 mt-0.5">{sub}</div>}
            </div>
            {right && <div className="text-zinc-900 font-semibold whitespace-nowrap">{right}</div>}
          </div>
          {children}
        </div>
      );
    }

    /* ── TopNav ────────────────────────────────────────────────────────── */
    function TopNav() {
      const [open, setOpen] = useState(false);
      const nav = [
        { href: '#services', label: 'Услуги' },
        { href: '#pricing', label: 'Цены' },
        { href: '#templates', label: 'Шаблоны' },
        { href: '#portfolio', label: 'Портфолио' },
        { href: '#process', label: 'Процесс' },
        { href: '#supervision', label: 'Надзор' },
        { href: '#faq', label: 'FAQ' },
        { href: '#contacts', label: 'Контакты' },
      ];
      return (
        <header className="sticky top-0 z-50 bg-white/85 backdrop-blur border-b border-zinc-200">
          <Container className="flex items-center justify-between py-3">
            <a href="#top" className="flex items-center gap-2.5 shrink-0">
              <div className="size-9 rounded-xl bg-zinc-900 text-white grid place-items-center font-bold text-lg">L</div>
              <div className="leading-none">
                <div className="font-semibold text-zinc-900">Любовь Очирова</div>
                <div className="text-xs text-zinc-500">проектировщик</div>
              </div>
            </a>
            <nav className="hidden lg:flex items-center gap-5 text-sm">
              {nav.map(n => (
                <a key={n.href} href={n.href} className="text-zinc-600 hover:text-zinc-900 transition-colors font-medium">{n.label}</a>
              ))}
              <a href="#contacts" className="rounded-2xl bg-zinc-900 text-white px-4 py-2 text-sm font-medium hover:bg-zinc-800 transition-colors">Связаться</a>
            </nav>
            <button
              onClick={() => setOpen(!open)}
              className="lg:hidden rounded-xl border border-zinc-200 px-3 py-2 text-sm font-medium"
            >
              {open ? '✕' : 'Меню'}
            </button>
          </Container>
          {open && (
            <div className="lg:hidden border-t bg-white">
              <Container className="py-4 grid gap-1">
                {nav.map(n => (
                  <a
                    key={n.href} href={n.href}
                    className="py-2.5 px-3 rounded-xl text-zinc-700 hover:bg-zinc-50 text-sm font-medium"
                    onClick={() => setOpen(false)}
                  >{n.label}</a>
                ))}
                <a
                  href="#contacts"
                  className="mt-2 rounded-2xl bg-zinc-900 text-white px-4 py-2.5 text-sm font-medium text-center"
                  onClick={() => setOpen(false)}
                >Связаться</a>
              </Container>
            </div>
          )}
        </header>
      );
    }

    /* ── Hero ──────────────────────────────────────────────────────────── */
    function Hero() {
      return (
        <section id="top" className="relative overflow-hidden bg-white scroll-mt-20">
          <BlueprintGrid opacity={0.06} />
          <Container className="py-16 lg:py-24 grid lg:grid-cols-2 gap-10 lg:gap-16 items-center">
            <div>
              <h1 className="text-3xl sm:text-4xl lg:text-5xl font-semibold tracking-tight text-zinc-900 leading-tight">
                Проектирование квартир, домов и мебели
              </h1>
              <p className="mt-3 text-xl text-zinc-500 font-medium">
                Спокойная эстетика, продуманная функциональность
              </p>
              <p className="mt-5 text-base text-zinc-700 max-w-prose leading-relaxed">
                Здравствуйте! Я — <strong className="text-zinc-900">Любовь Очирова</strong>. Помогаю создать продуманное и гармоничное пространство: планировки квартир и домов, проектирование мебели, 3D-модели и развёртки, подбор освещения и материалов. Веду проект от обмеров до авторского надзора.
              </p>
              <div className="mt-8 flex flex-wrap gap-3">
                <a href="#pricing" className="rounded-2xl bg-zinc-900 text-white px-5 py-3 text-sm font-semibold hover:bg-zinc-800 transition-colors">Смотреть цены</a>
                <a href="#templates" className="rounded-2xl border border-zinc-300 px-5 py-3 text-sm font-semibold hover:border-zinc-500 transition-colors">Шаблоны проектов</a>
                <a href="#calculators" className="rounded-2xl border border-zinc-300 px-5 py-3 text-sm font-semibold hover:border-zinc-500 transition-colors">Быстрый расчёт</a>
              </div>
              <p className="mt-5 text-sm text-zinc-500">Улан-Удэ и ближайшие районы · удалённо по РФ и миру</p>
            </div>
            <div className="relative">
              {/* ФОТО ПРОЕКТИРОВЩИКА: замените PhotoPh на <img src="photo.jpg" className="aspect-[3/4] rounded-3xl w-full object-cover" alt="Любовь Очирова" /> */}
              <PhotoPh className="aspect-[3/4] rounded-3xl w-full" label="Фото проектировщика" />
            </div>
          </Container>
        </section>
      );
    }

    /* ── TrustBar ──────────────────────────────────────────────────────── */
    function TrustBar() {
      const stats = [
        { val: '3+ года', label: 'Опыт проектирования' },
        { val: '40+ / год', label: 'Проектов в работе' },
        { val: '70%', label: 'Предоплата после ТЗ' },
        { val: 'Онлайн/офлайн', label: 'Формат работы' },
      ];
      return (
        <section className="border-y bg-zinc-50">
          <Container className="py-6 grid grid-cols-2 md:grid-cols-4 gap-6">
            {stats.map(s => (
              <div key={s.val}>
                <div className="text-2xl font-semibold text-zinc-900">{s.val}</div>
                <div className="text-sm text-zinc-600 mt-0.5 font-medium">{s.label}</div>
              </div>
            ))}
          </Container>
        </section>
      );
    }

    /* ── Services ──────────────────────────────────────────────────────── */
    function Services() {
      const cards = [
        {
          title: 'Базовый', price: '600 ₽/м²',
          bullets: ['Обмерный план', 'Демонтаж / монтаж перегородок', 'Расстановка мебели с размерами'],
        },
        {
          title: 'Стандарт', price: '1 200 ₽/м²', accent: true,
          bullets: ['Всё из Базового', 'Электрика: розетки / выключатели / высоты', 'Освещение и привязки', 'Вентиляция / коммуникации', 'План напольных покрытий', '3D-вид и развёртки'],
        },
        {
          title: 'Стандарт + Дизайн', price: '1 990 ₽/м²',
          bullets: ['Всё из Стандарта', 'Дизайн-концепция (коллажи, материалы)'],
        },
      ];
      return (
        <section id="services" className="relative py-16 bg-white scroll-mt-20">
          <BlueprintGrid opacity={0.05} />
          <Container>
            <SectionTitle sub="Выполняю планировочные решения квартир и домов, проектирую мебель, сопровождаю реализацию. Все решения — с учётом норм для согласования.">
              Услуги
            </SectionTitle>
            {/* ФОТО СЕКЦИИ: замените PhotoPh на img или div с background-image */}
            <div className="mb-8 overflow-hidden rounded-3xl">
              <PhotoPh className="h-48 w-full rounded-3xl" label="Фото / рендер проекта" />
            </div>
            <div className="grid md:grid-cols-3 gap-6">
              {cards.map(c => (
                <div key={c.title} className={`rounded-3xl border bg-white p-6 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-md ${c.accent ? 'ring-1 ring-zinc-300' : ''}`}>
                  <div className="flex items-baseline justify-between gap-4 mb-4">
                    <h3 className="text-lg font-semibold text-zinc-900">{c.title}</h3>
                    <div className="text-zinc-900 font-semibold whitespace-nowrap">{c.price}</div>
                  </div>
                  <ul className="grid gap-2.5">
                    {c.bullets.map((b, i) => (
                      <li key={i} className="flex items-start gap-2 text-base text-zinc-700">
                        <span className="mt-1.5 size-1.5 shrink-0 rounded-full bg-zinc-900"></span>
                        {b}
                      </li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
            <div className="mt-6 grid md:grid-cols-2 gap-6">
              <InfoCard title="Частный дом" sub="Три пакета">
                <ul className="grid gap-2 text-base text-zinc-700">
                  <li>Базовый — 1 000 ₽/м²</li>
                  <li>Стандарт — 1 500 ₽/м²</li>
                  <li>Стандарт + Дизайн — 2 200 ₽/м²</li>
                </ul>
              </InfoCard>
              <InfoCard title="Проект мебели" sub="шкафы, кухни, гардеробные" right="2 000 ₽/пог. м">
                <p className="text-base text-zinc-700">Обмер зоны, спецификации материалов / фурнитуры, план открывания; при необходимости — схемы электрики / подсветки.</p>
              </InfoCard>
            </div>
            <div className="mt-6">
              <InfoCard title="А-ля-карт чертежи" sub="по площади" right="100–500 ₽/м²">
                <ul className="grid gap-2 text-base text-zinc-700">
                  <li>Стены / перегородки — 100 ₽/м²</li>
                  <li>Мебель / техника / сантехника — 100 ₽/м²</li>
                  <li>Розетки / выключатели / слаботочка — 200 ₽/м²</li>
                  <li>Освещение — 100 ₽/м²</li>
                  <li>3D-модель — 500 ₽/м² (≤100 м²) или 400 ₽/м² (&gt;100 м²)</li>
                </ul>
              </InfoCard>
            </div>
          </Container>
        </section>
      );
    }

    /* ── Pricing ───────────────────────────────────────────────────────── */
    function Pricing() {
      const tiers = [
        { name: 'Базовый', price: '600 ₽/м²', features: ['Обмерный план', 'Демонтаж / монтаж', 'Мебель с размерами'] },
        { name: 'Стандарт', price: '1 200 ₽/м²', popular: true, features: ['Всё из Базового', 'Электрика (высоты/привязки)', 'Освещение', 'Вентиляция/коммуникации', 'План полов', '3D и развёртки'] },
        { name: 'Стандарт + Дизайн', price: '1 990 ₽/м²', features: ['Всё из Стандарта', 'Дизайн-концепция (коллажи)'] },
      ];
      return (
        <section id="pricing" className="relative py-16 bg-zinc-50 scroll-mt-20">
          <BlueprintGrid opacity={0.05} />
          <Container>
            <SectionTitle sub="Итоговая смета формируется после обмеров и утверждения ТЗ.">
              Цены и состав
            </SectionTitle>
            <div className="grid md:grid-cols-3 gap-6">
              {tiers.map(t => (
                <div key={t.name} className={`rounded-3xl border bg-white p-6 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-md ${t.popular ? 'ring-1 ring-zinc-300' : ''}`}>
                  <div className="flex items-start justify-between mb-1 gap-2">
                    <div className="text-lg font-semibold text-zinc-900">{t.name}</div>
                    {t.popular && <span className="text-xs bg-zinc-900 text-white rounded-full px-2.5 py-1 shrink-0">Популярный</span>}
                  </div>
                  <div className="text-xl font-semibold text-zinc-900 mb-4">{t.price}</div>
                  <ul className="grid gap-2.5 mb-5">
                    {t.features.map((f, i) => (
                      <li key={i} className="flex items-start gap-2 text-base text-zinc-700">
                        <span className="mt-1.5 size-1.5 shrink-0 rounded-full bg-zinc-900"></span>
                        {f}
                      </li>
                    ))}
                  </ul>
                  <a href="#calculators" className="block text-center rounded-2xl border border-zinc-300 px-4 py-2.5 text-sm font-semibold hover:border-zinc-500 transition-colors">Рассчитать стоимость</a>
                </div>
              ))}
            </div>
          </Container>
        </section>
      );
    }

    /* ── Calculators ───────────────────────────────────────────────────── */
    function FormField({ label, ...props }) {
      return (
        <label className="grid gap-1.5 text-sm">
          <span className="font-semibold text-zinc-700">{label}</span>
          <input {...props} className="rounded-xl border border-zinc-200 px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-zinc-900" />
        </label>
      );
    }

    function FormSelect({ label, children, ...props }) {
      return (
        <label className="grid gap-1.5 text-sm">
          <span className="font-semibold text-zinc-700">{label}</span>
          <select {...props} className="rounded-xl border border-zinc-200 px-3 py-2.5 text-base bg-white focus:outline-none focus:ring-2 focus:ring-zinc-900">
            {children}
          </select>
        </label>
      );
    }

    function Calculators() {
      return (
        <section id="calculators" className="relative py-16 bg-white scroll-mt-20">
          <Container>
            <SectionTitle sub="Черновая оценка. Точная стоимость — после обмеров и ТЗ.">
              Быстрый расчёт
            </SectionTitle>
            <div className="grid lg:grid-cols-2 gap-6">
              <CalcApartment />
              <CalcFurniture />
            </div>
          </Container>
        </section>
      );
    }

    function CalcApartment() {
      const [area, setArea] = useState(54);
      const [type, setType] = useState('apartment');
      const [pkg, setPkg] = useState('standard');
      const prices = { apartment: { basic: 600, standard: 1200, design: 1990 }, house: { basic: 1000, standard: 1500, design: 2200 } };
      const pricePer = prices[type][pkg];
      const total = area * pricePer;
      return (
        <InfoCard title="Квартира / Дом" sub="пакеты по м²" right={`${pretty(pricePer)} ₽/м²`}>
          <div className="grid sm:grid-cols-3 gap-3 mb-4">
            <FormField label="Площадь, м²" type="number" min={1} value={area} onChange={e => setArea(+e.target.value)} />
            <FormSelect label="Тип" value={type} onChange={e => setType(e.target.value)}>
              <option value="apartment">Квартира</option>
              <option value="house">Дом</option>
            </FormSelect>
            <FormSelect label="Пакет" value={pkg} onChange={e => setPkg(e.target.value)}>
              <option value="basic">Базовый</option>
              <option value="standard">Стандарт</option>
              <option value="design">+ Дизайн</option>
            </FormSelect>
          </div>
          <div className="text-base text-zinc-700">Ориентировочно: <strong className="text-zinc-900 text-xl">{pretty(total)} ₽</strong></div>
          <p className="mt-1.5 text-sm text-zinc-500">Точная стоимость — после обмеров и ТЗ.</p>
        </InfoCard>
      );
    }

    function CalcFurniture() {
      const [run, setRun] = useState(5);
      const total = run * 2000;
      return (
        <InfoCard title="Проект мебели" sub="по погонным метрам" right="2 000 ₽/пог. м">
          <div className="grid sm:grid-cols-2 gap-3 mb-4">
            <FormField label="Длина, пог. м" type="number" min={1} value={run} onChange={e => setRun(+e.target.value)} />
            <div className="grid gap-1.5 text-sm">
              <span className="font-semibold text-zinc-700">Итого ориентировочно</span>
              <div className="rounded-xl border border-zinc-200 px-3 py-2.5 bg-zinc-50 text-xl font-semibold text-zinc-900">{pretty(total)} ₽</div>
            </div>
          </div>
          <p className="text-sm text-zinc-500">Включены обмеры, спецификация материалов / фурнитуры, план открывания; при необходимости — электрика / подсветка.</p>
        </InfoCard>
      );
    }

    /* ── Template Shop ─────────────────────────────────────────────────── */
    function TemplateShop() {
      const [selected, setSelected] = useState(null);
      return (
        <section id="templates" className="relative py-16 bg-zinc-50 scroll-mt-20">
          <BlueprintGrid opacity={0.05} />
          <Container>
            <SectionTitle sub="Готовые проекты с возможностью корректировок — значительно дешевле разработки с нуля. Скажите, что хотите изменить — адаптируем под ваш запрос.">

    /* ── Chat Widget ───────────────────────────────────────────────────── */
    function ChatWidget() {
      const [open, setOpen] = useState(false);
      const [messages, setMessages] = useState([
        { role: 'assistant', text: 'Здравствуйте! Я ассистент Любови Очировой. Готов ответить на вопросы об услугах, ценах и процессе работы.' }
      ]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const bottomRef = useRef(null);

      useEffect(() => {
        if (open && bottomRef.current) {
          bottomRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages, open]);

      async function sendMessage(e) {
        e.preventDefault();
        if (!input.trim() || loading) return;
        const userMsg = input.trim();
        setInput('');
        setMessages(prev => [...prev, { role: 'user', text: userMsg }]);
        setLoading(true);
        try {
          const data = await postWebhook(WEBHOOK_CHAT, {
            type: 'chat',
            message: userMsg,
            history: messages.map(m => ({ role: m.role, content: m.text })),
          });
          const reply = data.response || data.output || data.message || data.text || data.answer || 'Получен ответ от ассистента.';
          setMessages(prev => [...prev, { role: 'assistant', text: reply }]);
        } catch {
          setMessages(prev => [...prev, {
            role: 'assistant',
            text: 'Не удалось получить ответ. Попробуйте позже или позвоните: 8-914-9-855-100'
          }]);
        }
        setLoading(false);
      }

      return (
        <>
          {open && (
            <div
              className="fixed bottom-20 right-4 sm:right-6 z-50 w-80 sm:w-96 bg-white rounded-3xl shadow-2xl border flex flex-col overflow-hidden"
              style={{ maxHeight: '480px' }}
            >
              <div className="flex items-center justify-between px-4 py-3 bg-zinc-900 text-white shrink-0">
                <div>
                  <div className="font-semibold text-sm">Ассистент</div>
                  <div className="text-xs text-zinc-400">Ответим на все вопросы</div>
                </div>
                <button onClick={() => setOpen(false)} className="size-7 grid place-items-center rounded-full hover:bg-white/10 text-sm">✕</button>
              </div>
              <div className="flex-1 overflow-y-auto p-4 grid gap-3 content-start" style={{ minHeight: 0 }}>
                {messages.map((m, i) => (
                  <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[82%] rounded-2xl px-3.5 py-2.5 text-sm leading-relaxed ${
                      m.role === 'user'
                        ? 'bg-zinc-900 text-white rounded-br-sm'
                        : 'bg-zinc-100 text-zinc-800 rounded-bl-sm'
                    }`}>
                      {m.text}
                    </div>
                  </div>
                ))}
                {loading && (
                  <div className="flex justify-start">
                    <div className="bg-zinc-100 rounded-2xl rounded-bl-sm px-3.5 py-3">
                      <div className="flex gap-1 items-center">
                        {[0, 150, 300].map(d => (
                          <div key={d} className="size-1.5 rounded-full bg-zinc-400 animate-bounce" style={{ animationDelay: `${d}ms` }} />
                        ))}
                      </div>
                    </div>
                  </div>
                )}
                <div ref={bottomRef} />
              </div>
              <form onSubmit={sendMessage} className="border-t flex gap-2 p-3 shrink-0">
                <input
                  type="text"
                  value={input}
                  onChange={e => setInput(e.target.value)}
                  placeholder="Напишите сообщение..."
                  className="flex-1 rounded-xl border border-zinc-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-zinc-900"
                />
                <button
                  type="submit"
                  disabled={!input.trim() || loading}
                  className="rounded-xl bg-zinc-900 text-white px-3 py-2 text-sm font-semibold disabled:opacity-40 transition-opacity"
                >
                  →
                </button>
              </form>
            </div>
          )}
          <button
            onClick={() => setOpen(!open)}
            className="fixed bottom-4 right-4 sm:right-6 z-50 size-14 rounded-full bg-zinc-900 text-white shadow-lg flex items-center justify-center hover:bg-zinc-800 transition-all duration-200 hover:scale-105 active:scale-95"
            aria-label="Открыть чат с ассистентом"
          >
            {open ? (
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                <path d="M18 6L6 18M6 6l12 12"/>
              </svg>
            ) : (
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            )}
          </button>
        </>
      );
    }
